name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama Anda bernama master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # Diubah ke 8.4 karena file composer.lock terkunci pada paket yang membutuhkan PHP >= 8.4.1
          extensions: mbstring, bcmath, pdo_mysql, xml, ctype, iconv, intl, dom, filter, gd, json
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev --no-progress --no-interaction

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Samakan dengan versi Node lokal agar package-lock.json konsisten

      - name: 📦 Install NPM Dependencies & Build Vite
        run: |
          npm ci
          npm run build

      - name: ⚙️ Setup Server Configuration (.env & .htaccess)
        run: |
          # 1. Siapkan .env untuk production
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            cp .env.example .env
            php artisan key:generate
            sed -i 's/APP_ENV=local/APP_ENV=production/g' .env
            sed -i 's/APP_DEBUG=true/APP_DEBUG=false/g' .env
            sed -i 's/DB_DATABASE=laravel/DB_DATABASE=${{ secrets.DB_DATABASE }}/g' .env
            sed -i 's/DB_USERNAME=root/DB_USERNAME=${{ secrets.DB_USERNAME }}/g' .env
            sed -i 's/DB_PASSWORD=/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/g' .env
          fi
          
          # 2. Buat file .htaccess di root agar otomatis diarahkan ke folder public (khas Hostinger)
          cat << 'EOF' > .htaccess
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteRule ^(.*)$ public/$1 [L]
          </IfModule>
          EOF

      - name: 🗑️ Bersihkan file yang tidak perlu diupload
        run: rm -rf .git .github node_modules tests .env.example README.md Database_Schema.md Development_Rules_And_Steps.md PRD_WMU.md SEO_Configuration.md

      - name: 📂 Deploy via SFTP to Hostinger
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          source: "."
          # Sesuaikan dengan nama folder website Anda di Hostinger
          target: "domains/winmulyautama.com/public_html"

      # Masuk ke server via SSH lalu jalankan artisan memakai .env production.
      # AMAN: hanya `migrate` biasa (menambah migrasi baru), TIDAK PERNAH
      # migrate:fresh / refresh / reset / db:wipe. Database di-backup dulu.
      - name: 🗄️ Backup DB, Clear Cache & Migrate di Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          script: |
            set -eo pipefail
            cd ~/domains/winmulyautama.com/public_html

            # Ambil kredensial DB dari .env production
            env_val() { grep -E "^$1=" .env | tail -n1 | cut -d= -f2- | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
            DB_HOST="$(env_val DB_HOST)"; DB_PORT="$(env_val DB_PORT)"
            DB_NAME="$(env_val DB_DATABASE)"; DB_USER="$(env_val DB_USERNAME)"; DB_PASS="$(env_val DB_PASSWORD)"

            # 1. Backup database (di luar public_html, simpan 10 terakhir).
            #    Kalau backup gagal, deploy berhenti dan migrate TIDAK dijalankan.
            mkdir -p ~/db_backups
            BACKUP=~/db_backups/${DB_NAME}_$(date +%Y%m%d_%H%M%S).sql.gz
            MYSQL_PWD="$DB_PASS" mysqldump -h "${DB_HOST:-127.0.0.1}" -P "${DB_PORT:-3306}" -u "$DB_USER" \
              --single-transaction --no-tablespaces --routines "$DB_NAME" | gzip > "$BACKUP"
            echo "Backup tersimpan: $BACKUP"
            ls -1t ~/db_backups/*.sql.gz | tail -n +11 | xargs -r rm --

            # 2. Bersihkan cache lama (config, route, view, packages)
            php artisan optimize:clear

            # 3. Symlink storage untuk file upload (kalau belum ada)
            [ -e public/storage ] || php artisan storage:link

            # 4. Jalankan HANYA migrasi baru yang belum pernah dijalankan
            if php artisan migrate:status > /dev/null 2>&1; then
              php artisan migrate --force
            else
              echo "PERINGATAN: tabel 'migrations' tidak ditemukan di DB production, migrate dilewati agar tidak bentrok dengan tabel yang sudah ada."
            fi
